services:
  story-template:
    platform: linux/amd64
    image: story/template
    ports:
      - 8100:8100 # SingleEngine          (vite)
      - 8101:8101 # Visualizer client     (vite)
      - 8102:8102 # MultiEngine client    (vite)
      - 8103:8103 # Landing page          (vite) — the story list, proxies /api to 8123
      - 8123:8123 # Visualizer server     (node/tsx) — the client reaches it via its /api proxy
      - 8124:8124 # MultiEngine server    (node/tsx)
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      - ~/.gitconfig:/home/node/.gitconfig-host:ro
    command: tail -f /dev/stdout
    working_dir: /app
    user: node
    tty: true
