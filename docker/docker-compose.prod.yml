# Production (multiple stories, phase 11): `make prod-up`, or
#   SITE_ADDRESS=stories.example.com docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Two public origins, served by Caddy (`docker/Caddyfile`) on 80/443:
#   SITE_ADDRESS       /  landing page · /visualizer/  Visualizer client · /api/  the server (server/)
#   PLAY_SITE_ADDRESS  /play/  SinglePlayer · /api/  the server, the player's routes only
# The player runs story code, so it gets an origin of its own.
#
# Only Caddy publishes ports. The server is reachable only through it, which is what makes
# `TRUST_PROXY=1` (the login limiter trusts X-Forwarded-For) safe.
#
# SITE_ADDRESS: the public host name (default `localhost`, with a certificate from Caddy's local
# CA). The public origin, `https://<SITE_ADDRESS>`, is the server's `ALLOWED_ORIGINS`.
# PLAY_SITE_ADDRESS: the play site's host name (default `play.<SITE_ADDRESS>`); it needs its own DNS
# record. Not in `ALLOWED_ORIGINS`: the play site posts only to itself.
#
# Secrets come from `.env` next to this file (`docker/.env`, copied from `.env.example`): `DB_PASSWORD`,
# `MYSQL_ROOT_PASSWORD`. MySQL publishes no port; only the server reaches it. Optional: `GIT_TOKEN_KEY`
# (`openssl rand -base64 32`; enables git for stories and encrypts their tokens, unset = git unavailable)
# and `GIT_ALLOWED_HOSTS` (the hosts a story's git remote may point at).
#
# Story content lives in the `stories` volume, story metadata and logins in the database (`mysql`
# volume), so a restart keeps everyone logged in. On start the server service (and only it:
# STORY_DB_SETUP=1) applies the migrations, imports any legacy `story.json` and seeds the example
# and demo stories into an empty database (`docker/prod-entrypoint.sh`).
name: story-prod

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile.prod
    target: app
  image: story-prod-app
  restart: unless-stopped
  init: true
  user: node
  volumes:
    - stories:/app/stories

services:
  server:
    <<: *app
    working_dir: /app/server
    # source-only like in dev: the swc loader emits the decorator metadata Nest needs
    command: [node, --import, '@swc-node/register/esm-register', src/main.ts]
    environment:
      STORY_DB_SETUP: '1'
      STORIES_ROOT: /app/stories
      PORT: '8123'
      COOKIE_SECURE: '1'
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:-localhost}
      TRUST_PROXY: '1'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: ${DB_USER:-story}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      DB_NAME: ${DB_NAME:-story}
      GIT_TOKEN_KEY: ${GIT_TOKEN_KEY:-}
      GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8123/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${DB_NAME:-story}
      MYSQL_USER: ${DB_USER:-story}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: proxy
    image: story-prod-proxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      PLAY_SITE_ADDRESS: ${PLAY_SITE_ADDRESS:-play.${SITE_ADDRESS:-localhost}}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  stories:
  mysql:
  caddy_data:
  caddy_config:
