# Production (multiple stories, phase 11): `make prod-up`, or
#   SITE_ADDRESS=stories.example.com docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Two public origins, served by Caddy (`docker/Caddyfile`) on 80/443:
#   SITE_ADDRESS       /  landing page · /visualizer/  Visualizer client · /api/  the server (server/)
#   PLAY_SITE_ADDRESS  /play/  SinglePlayer · /api/  the server, the player's routes only
# The player runs story code, so it gets an origin of its own.
#
# Only Caddy publishes ports. The server is reachable only through it, which is what makes
# `TRUST_PROXY=1` (the login limiter trusts X-Forwarded-For) safe.
#
# SITE_ADDRESS: the public host name (default `localhost`, with a certificate from Caddy's local
# CA). The public origin, `https://<SITE_ADDRESS>`, is the server's `ALLOWED_ORIGINS`.
# PLAY_SITE_ADDRESS: the play site's host name (default `play.<SITE_ADDRESS>`); it needs its own DNS
# record. Not in `ALLOWED_ORIGINS`: the play site posts only to itself.
#
# Secrets come from `.env` next to this file (`docker/.env`, copied from `.env.example`): `DB_PASSWORD`,
# `MYSQL_ROOT_PASSWORD`. MySQL publishes no port; only the server reaches it. Optional: `GIT_TOKEN_KEY`
# (`openssl rand -base64 32`; enables git for stories and encrypts their tokens, unset = git unavailable)
# and `GIT_ALLOWED_HOSTS` (the hosts a story's git remote may point at). `SMTP_URL` (e.g.
# `smtps://user:password@smtp.example.com`) sends the password reset mails, unset = they are only logged;
# their links start with `PUBLIC_URL`, `https://<SITE_ADDRESS>`. The sender is `MAIL_FROM` from the image.
#
# Story content lives in the `stories` volume, story metadata and logins in the database (`mysql`
# volume), so a restart keeps everyone logged in. On start the server service (and only it:
# STORY_DB_SETUP=1) applies the migrations, imports any legacy `story.json` and seeds the example
# and demo stories into an empty database (`docker/prod-entrypoint.sh`).
#
# AI agent (docs/Server.md#ai-agent): `ai-launcher` is the only service with the docker socket. It starts
# one `story-ai` container per story (the image of the `ai-image` service, `docker/Dockerfile.ai`) on the
# `story-ai` network, with only that story's `data/` and `types/` mounted (subpaths of the `stories`
# volume, Docker Engine >= 26) and its transcripts in the `story-ai-sessions` volume. The server reaches the
# launcher on the internal `ai-control` network; agents cannot. `make prod-up` builds the agent image; the
# launcher creates the `story-ai` network at startup. Needs, next to this file:
#   DOCKER_GID in `.env`        the group of /var/run/docker.sock on the host (`stat -c %g /var/run/docker.sock`)
#   secrets/ai_token            the Anthropic API key (`sk-ant-api…`); empty = AI unavailable
#   secrets/ai_launcher_key     shared by the server and the launcher: `openssl rand -hex 32`
# Both files must exist and be readable by uid 1000 (`chmod 644`, or a group the host shares with uid 1000).
# The stories and sessions volumes have fixed names, because the launcher names them in `docker run`.
name: story-prod

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile.prod
    target: app
  image: story-prod-app
  restart: unless-stopped
  init: true
  user: node
  volumes:
    - stories:/app/stories

services:
  server:
    <<: *app
    working_dir: /app/server
    # source-only like in dev: the swc loader emits the decorator metadata Nest needs
    command: [node, --import, '@swc-node/register/esm-register', src/main.ts]
    environment:
      STORY_DB_SETUP: '1'
      STORIES_ROOT: /app/stories
      PORT: '8123'
      COOKIE_SECURE: '1'
      ALLOWED_ORIGINS: https://${SITE_ADDRESS:-localhost}
      TRUST_PROXY: '1'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: ${DB_USER:-story}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      DB_NAME: ${DB_NAME:-story}
      GIT_TOKEN_KEY: ${GIT_TOKEN_KEY:-}
      GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-}
      PUBLIC_URL: https://${SITE_ADDRESS:-localhost}
      SMTP_URL: ${SMTP_URL:-}
      AI_LAUNCHER_URL: http://ai-launcher:8124
      AI_MAX_BUDGET_USD: ${AI_MAX_BUDGET_USD:-5}
    volumes:
      - stories:/app/stories
      - ai-sessions:/app/ai-sessions
    secrets:
      - source: ai_launcher_key
        target: /secret/ai_launcher_key
    networks:
      - default
      - ai-control
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8123/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # The AI launcher (server/aiLauncher/): no published port, reachable only on `ai-control`.
  ai-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: launcher
    image: story-prod-launcher
    restart: unless-stopped
    init: true
    user: node
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID in docker/.env (stat -c %g /var/run/docker.sock)}
    environment:
      AI_LAUNCHER_PORT: '8124'
      AI_SANDBOX_DRIVER: docker-run
      AI_IMAGE: story-ai:latest
      AI_STORIES_VOLUME: story-prod_stories
      AI_SESSIONS_VOLUME: story-ai-sessions
      AI_NETWORK: story-ai
      AI_MODELS: ${AI_MODELS:-claude-sonnet-5-5,claude-opus-5-5}
      AI_MAX_BUDGET_USD: ${AI_MAX_BUDGET_USD:-5}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - source: ai_token
        target: /secret/ai_token
      - source: ai_launcher_key
        target: /secret/ai_launcher_key
    networks:
      - ai-control

  # Build only (`docker compose --profile build build ai-image`, part of `make prod-up`): the agent image the
  # launcher runs. Never started by compose.
  ai-image:
    profiles: [build]
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    image: story-ai:latest

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${DB_NAME:-story}
      MYSQL_USER: ${DB_USER:-story}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      target: proxy
    image: story-prod-proxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      PLAY_SITE_ADDRESS: ${PLAY_SITE_ADDRESS:-play.${SITE_ADDRESS:-localhost}}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  # fixed names: the launcher mounts them into the agent containers by name
  stories:
    name: story-prod_stories
  ai-sessions:
    name: story-ai-sessions
  mysql:
  caddy_data:
  caddy_config:

networks:
  default:
  # the server and the launcher only, no internet
  ai-control:
    internal: true

secrets:
  ai_token:
    file: ./secrets/ai_token
  ai_launcher_key:
    file: ./secrets/ai_launcher_key
